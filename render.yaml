services:
  - type: web
    name: estatein-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      - key: CLIENT_ORIGIN
        sync: false
